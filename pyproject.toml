[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-cli"
version = "0.1.0"
description = "Pipeline orchestrator CLI"
requires-python = ">=3.9"

[project.scripts]
pipeline = "pipeline_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
